industries:
  - id: healthcare
    name: Healthcare
    card: HIPAA-aware engineers for payer, provider and health-tech platforms, including HL7 and FHIR integration work.
    lead: >-
      Intellivra Global staffs healthcare payers, providers and health-technology companies
      with engineers who have worked inside HIPAA scope and understand protected health
      information handling before their first day.
    body: >-
      Typical work: claims and eligibility platform modernisation, HL7 v2 and FHIR
      integration, EHR data extraction into analytics platforms, patient-facing portals, and
      care-management reporting. Candidates for PHI-adjacent roles complete HIPAA training
      and an OIG exclusion check as part of onboarding.
    roles:
      - Integration engineers (HL7, FHIR, Mirth, Rhapsody)
      - Epic and Cerner analysts and report writers
      - Healthcare data engineers and actuarial data analysts
      - Cloud engineers with HITRUST or HIPAA experience
      - QA engineers for regulated release processes
    search_terms: HIPAA PHI HL7 FHIR Epic Cerner payer provider HITRUST OIG claims eligibility

  - id: bfsi
    name: Banking, Financial Services & Insurance
    short_name: Banking & financial services
    card: Engineers who have worked under model risk management, SOX controls and PCI DSS scope.
    lead: >-
      Intellivra Global places engineers in banks, insurers, payment companies and capital
      markets firms, where the constraint is rarely the technology and almost always the
      control environment around it.
    body: >-
      Typical work: core banking and payments integration, fraud and AML analytics, model
      risk management documentation for machine learning features, PCI DSS scope reduction,
      and regulatory reporting pipelines. Candidates can be screened against FINRA
      registration, credit checks and enhanced background requirements where the client's
      policy calls for it.
    roles:
      - Java, .NET and Python engineers for core platforms
      - Data engineers for risk, finance and regulatory reporting
      - ML engineers working under model risk governance
      - Cloud and security engineers in PCI or SOX scope
      - Business analysts with payments or lending domain depth
    search_terms: banking payments fraud AML model risk PCI DSS SOX FINRA capital markets insurance lending

  - id: retail
    name: Retail & E-commerce
    card: "Peak-season scale: order management, personalisation and demand forecasting teams."
    lead: >-
      Intellivra Global staffs retail and e-commerce technology teams on a seasonal rhythm:
      capacity ramps before peak, hardens through peak, and converts the keepers afterwards.
    body: >-
      Typical work: order management and fulfilment integration, storefront performance,
      personalisation and recommendation systems, demand forecasting, inventory visibility
      across channels, and the load-testing programme that has to be finished before the code
      freeze in October.
    roles:
      - Commerce platform engineers (Shopify, SFCC, commercetools)
      - Frontend engineers focused on Core Web Vitals
      - Data scientists for pricing and demand forecasting
      - Integration engineers for OMS, WMS and ERP
      - SREs for peak readiness and load testing
    search_terms: retail ecommerce order management fulfilment personalisation forecasting OMS WMS Shopify peak season

  - id: manufacturing
    name: Manufacturing
    card: MES, IIoT and shop-floor data integration engineers who understand OT and IT boundaries.
    lead: >-
      Intellivra Global supplies manufacturers with engineers who can work across the OT and
      IT boundary - people who are comfortable with both a historian and a data warehouse.
    body: >-
      Typical work: MES and ERP integration, IIoT telemetry pipelines from the plant floor,
      predictive maintenance models, quality analytics, digital twin data foundations, and
      the unglamorous network segmentation work that has to precede any of it.
    roles:
      - MES and SCADA integration engineers
      - IIoT and edge data engineers (OPC UA, MQTT)
      - SAP and ERP integration consultants
      - Data scientists for predictive maintenance
      - OT security engineers
    search_terms: manufacturing MES SCADA IIoT OPC UA MQTT predictive maintenance SAP digital twin OT security

  - id: energy
    name: Energy & Utilities
    card: Grid analytics, asset performance and NERC CIP-aware platform engineering.
    lead: >-
      Intellivra Global works with utilities, grid operators and renewable energy developers
      on asset, meter and market data platforms, with NERC CIP awareness where the systems sit
      inside the electronic security perimeter.
    body: >-
      Typical work: AMI and meter data management pipelines, outage and asset performance
      analytics, renewable generation forecasting, GIS data integration, and trading and
      settlement reporting. Personnel risk assessment and CIP-004 training requirements are
      handled during onboarding rather than discovered at go-live.
    roles:
      - Meter data and time-series engineers
      - GIS and asset management analysts
      - Forecasting data scientists for generation and load
      - Cloud engineers with NERC CIP exposure
      - SCADA and EMS integration specialists
    search_terms: energy utilities grid AMI meter data NERC CIP outage GIS renewable forecasting settlement

  - id: technology
    name: Technology & SaaS
    card: Product engineers and platform teams for scale-ups shipping against tight release trains.
    lead: >-
      Intellivra Global helps software companies add product engineers and platform teams
      without slowing the release train, usually in the window between a funding round and a
      full internal recruiting build-out.
    body: >-
      Typical work: sustained product engineering pods, multi-tenant platform hardening,
      developer experience and build performance, migration off legacy services, QA automation
      build-out, and AI feature teams working alongside an existing product group.
    roles:
      - Senior full-stack and backend product engineers
      - Platform and developer-experience engineers
      - SREs and observability engineers
      - QA automation engineers
      - AI and LLM application engineers
    search_terms: SaaS product engineering platform developer experience multi-tenant QA automation observability

# ---------------------------------------------------------------------------
#  FAQs. The visible accordions AND the FAQPage JSON-LD are both generated
#  from these entries, so the two can never drift apart.
# ---------------------------------------------------------------------------
faqs:
  home:
    - q: How fast can Intellivra Global submit candidates?
      a: >-
        Intellivra Global submits three to five pre-vetted profiles within 48 hours of an
        approved job description. Every candidate has already completed a structured technical
        screen and a work-sample review, so client interviews usually start in the same week.
    - q: What engagement models does Intellivra Global offer?
      a: >-
        Intellivra Global offers four engagement models: IT staff augmentation on an hourly
        bill rate, contract and contract-to-hire, direct placement on a percentage of
        first-year salary, and outcome-based managed teams delivered under a statement of work.
    - q: What is the difference between staff augmentation and a managed team?
      a: >-
        In staff augmentation the client manages the engineer day to day and pays for time. In
        a managed team, Intellivra Global owns the delivery plan, the team composition and the
        agreed outcomes, and the client pays for milestones defined in a statement of work.
    - q: How does Intellivra Global vet engineers?
      a: >-
        Every candidate passes a four-stage screen: an AI-assisted resume and skills match
        against the requisition, a live technical interview with a practising engineer, a
        work-sample or code review, and employment plus reference verification. Roughly one in
        fourteen applicants reaches a client submission.
    - q: Does Intellivra Global support W2, C2C and 1099 engagements?
      a: >-
        Yes. Intellivra Global engages consultants on W2, corp-to-corp and 1099 terms in the
        United States, and supports H-1B transfers, E-Verify onboarding and OPT or CPT
        candidates where the role and client policy allow.
    - q: How is Intellivra Global priced?
      a: >-
        Contract roles are billed at a transparent hourly rate with the margin disclosed on
        request. Direct placement is billed as a percentage of first-year base salary,
        typically 18 to 22 percent. Managed teams are priced per sprint or per milestone under
        a statement of work.
    - q: Is there a replacement guarantee?
      a: >-
        Yes. Contract placements carry a 30-day replacement guarantee and direct placements
        carry a 90-day guarantee. If a placed professional leaves or is released for
        performance inside that window, Intellivra Global replaces them at no additional fee.
    - q: Can Intellivra Global work through our VMS or MSP programme?
      a: >-
        Yes. Intellivra Global is set up to work as a subcontractor or tier-two supplier inside
        vendor management systems such as Fieldglass, Beeline and Coupa, and can also contract
        directly with procurement outside a managed service programme.
  services:
    - q: Which engagement model should we choose for a single hard-to-fill role?
      a: >-
        For one hard-to-fill role, use direct placement if the work is permanent and funded
        from headcount, and contract-to-hire if the budget sits in operating expense or the
        team wants to validate fit first. Both routes draw from the same vetted talent pool at
        Intellivra Global.
    - q: What is the minimum contract length for staff augmentation?
      a: >-
        The minimum staff augmentation engagement is three months, with a two-week notice
        period after the first 30 days. Shorter advisory engagements are handled as fixed-scope
        statements of work instead.
    - q: Can Intellivra Global staff an entire offshore delivery team?
      a: >-
        Yes. Intellivra Global runs blended teams with US-based leads and engineers in the
        India delivery centre, with a minimum four-hour overlap with US business hours and a
        single point of accountability for delivery.
    - q: How long does it take to stand up a managed team?
      a: >-
        A managed team of four to six people is typically productive within three weeks: one
        week for scoping and acceptance criteria, one week for staffing from the vetted bench,
        and one week for environment access and onboarding.
    - q: Who owns the intellectual property created during an engagement?
      a: >-
        The client owns all work product. Intellivra Global assigns intellectual property in
        the master services agreement, and every consultant signs a matching assignment and
        confidentiality agreement before the engagement starts.
    - q: Does Intellivra Global provide background checks and drug screening?
      a: >-
        Yes. Standard onboarding includes identity and right-to-work verification, a seven-year
        criminal background check and employment verification. Drug screening, fingerprinting
        and client-specific checks such as OIG or FINRA are available on request.
    - q: How does Intellivra Global handle rate transparency?
      a: >-
        Intellivra Global discloses the pay rate, the bill rate and the margin on request for
        any contract placement, and shares the market rate data used to set the range so
        procurement can benchmark the number independently.
    - q: What happens if a placed consultant is not performing?
      a: >-
        Raise it with the account lead and Intellivra Global starts a replacement search the
        same day. Contract placements carry a 30-day replacement guarantee and direct
        placements 90 days, and hours billed for the replacement search are not charged.

