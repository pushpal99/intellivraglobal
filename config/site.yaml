# ---------------------------------------------------------------------------
#  Service lines. Drives the services page, the home page cards, the footer
#  menu, the site search index and the Service JSON-LD - all from this list.
# ---------------------------------------------------------------------------
services:
  - id: staff-augmentation
    name: IT Staff Augmentation
    short_name: IT staff augmentation
    service_type: IT staff augmentation
    icon: users
    card: Add vetted engineers to your existing squads under your own management, on an hourly bill rate with no long-term commitment.
    card_meta: "Typical start: 5-10 business days"
    schema_description: >-
      Intellivra Global adds pre-vetted engineers to an existing in-house team on an hourly
      bill rate, under the client's own management and delivery process.
    lead: >-
      IT staff augmentation is the practice of adding external engineers to an existing
      in-house team under the client's own management. Intellivra Global supplies those
      engineers on an hourly bill rate, typically within five to ten business days.
    body:
      - >-
        You keep the backlog, the standups and the definition of done. We carry payroll,
        benefits, insurance and compliance, and we replace anyone who is not working out
        inside the first 30 days at no extra cost. Engagements start at three months and
        roll month to month afterwards with two weeks' notice.
      - >-
        Common roles: senior full-stack, backend and frontend engineers, data engineers,
        cloud and platform engineers, SREs, QA automation engineers, business analysts and
        Scrum masters.
    panel_title: At a glance
    panel:
      - label: "Pricing:"
        text: hourly bill rate, margin disclosed on request
      - label: "Time to start:"
        text: 5-10 business days
      - label: "Minimum term:"
        text: 3 months, then month to month
      - label: "Guarantee:"
        text: 30-day replacement
      - label: "Worker classification:"
        text: W2, C2C or 1099
      - label: "Best for:"
        text: known scope, your process, your management
    cta: Request engineers
    search_terms: hourly bill rate contractors augmentation team capacity W2 C2C 1099 replacement guarantee

  - id: contract-hire
    name: Contract & Contract-to-Hire
    short_name: Contract & contract-to-hire
    service_type: Contract and contract-to-hire staffing
    icon: document
    card: Trial an engineer on our payroll, then convert with no conversion fee after six months of billing.
    card_meta: W2, C2C and 1099 supported
    schema_description: >-
      Intellivra Global places consultants on contract or contract-to-hire terms, carrying
      payroll, benefits and compliance until the client converts the consultant to their
      own payroll.
    lead: >-
      Contract-to-hire lets a company evaluate an engineer on a contract basis before
      converting them to a permanent employee. Intellivra Global waives the conversion fee
      after six months of continuous billing.
    body:
      - >-
        This is the lowest-risk way to fill a role when the budget sits in operating expense
        rather than headcount, or when a team wants to see real work before committing. The
        consultant stays on our payroll, with health cover, PTO accrual and I-9 or E-Verify
        handled by us, and moves across on a date you choose.
      - >-
        We support H-1B transfers, OPT and CPT candidates where client policy allows, and we
        handle the immigration paperwork rather than pushing it to the candidate.
    panel_title: At a glance
    panel:
      - label: "Pricing:"
        text: hourly bill rate; no conversion fee after 6 months
      - label: "Early conversion:"
        text: prorated buyout, agreed up front
      - label: "Time to start:"
        text: 5-10 business days
      - label: "Compliance:"
        text: I-9, E-Verify and state registrations handled
      - label: "Visa support:"
        text: H-1B transfer, OPT, CPT where permitted
      - label: "Best for:"
        text: validating fit before adding headcount
    cta: Discuss a contract role
    search_terms: contract to hire conversion fee temp to perm payroll H-1B OPT CPT E-Verify

  - id: direct-placement
    name: Direct Placement
    short_name: Direct placement
    service_type: Direct placement recruiting
    icon: star
    card: Permanent hires sourced and closed by recruiters who specialise in one technology domain, with a 90-day guarantee.
    card_meta: 18-22% of first-year base salary
    schema_description: >-
      Intellivra Global recruits permanent employees for enterprise technology teams, billed
      as a percentage of first-year base salary with a 90-day replacement guarantee.
    lead: >-
      Direct placement is permanent hiring: Intellivra Global sources, screens and closes a
      full-time employee for your payroll, billed at 18 to 22 percent of first-year base
      salary with a 90-day replacement guarantee.
    body:
      - >-
        Recruiters are organised by technology domain rather than by industry, so the person
        calling a Kubernetes engineer has placed Kubernetes engineers before and can hold a
        credible conversation about the role. We work contingent by default; retained search
        is available for leadership roles where confidentiality matters.
      - >-
        You get a written intake document, weekly pipeline reporting, structured interview
        feedback and offer management including counter-offer risk assessment.
    panel_title: At a glance
    panel:
      - label: "Pricing:"
        text: 18-22% of first-year base salary
      - label: "Guarantee:"
        text: 90-day replacement
      - label: "Model:"
        text: contingent by default, retained on request
      - label: "Median close:"
        text: 11 days from first submission
      - label: "Reporting:"
        text: weekly pipeline and market feedback
      - label: "Best for:"
        text: funded headcount and leadership hires
    cta: Start a search
    search_terms: permanent hiring placement fee retained contingent full-time employee offer management

  - id: ai-data
    name: AI & Data Engineering Solutions
    short_name: AI & data engineering
    service_type: AI and data engineering
    icon: database
    card: Lakehouse pipelines, feature stores and production LLM applications built with evaluation and governance from day one.
    card_meta: Databricks, Snowflake, dbt, Airflow
    schema_description: >-
      Intellivra Global designs and builds data platforms, machine learning pipelines and
      production LLM applications, including evaluation harnesses and model governance
      documentation.
    lead: >-
      Intellivra Global builds data platforms and production AI systems: lakehouse pipelines,
      feature stores, retrieval-augmented applications and the evaluation harnesses that keep
      them honest once they are live.
    body:
      - >-
        Most AI projects stall in the gap between a working prototype and something an
        enterprise can run. We close that gap: data contracts and lineage so pipelines fail
        loudly, offline and online evaluation so quality is measured rather than assumed, and
        model documentation written for the risk and compliance review that will inevitably
        follow.
      - >-
        Typical stack: Databricks, Snowflake, dbt, Airflow, Kafka, Spark, Python, PyTorch,
        vector databases and the major model providers.
    panel_title: What we deliver
    panel:
      - text: Lakehouse and warehouse builds with dbt models and tests
      - text: Streaming and batch pipelines with lineage and quality gates
      - text: Feature stores and ML training or inference pipelines
      - text: RAG assistants with retrieval evaluation and guardrails
      - text: Model risk documentation for regulated review boards
      - text: "BI enablement: semantic layer, metric definitions, dashboards"
    cta: Scope a data project
    search_terms: lakehouse warehouse pipelines RAG LLM machine learning evaluation governance Databricks Snowflake dbt Airflow Kafka Spark

  - id: cloud-devops
    name: Cloud & DevOps
    short_name: Cloud & DevOps
    service_type: Cloud and DevOps engineering
    icon: cloud
    card: Landing zones, Kubernetes platforms and CI/CD paths that cut deployment lead time and pass audit.
    card_meta: AWS, Azure, GCP, Terraform
    schema_description: >-
      Intellivra Global builds AWS, Azure and GCP landing zones, Kubernetes platforms and
      CI/CD delivery paths, with infrastructure as code and audit-ready controls.
    lead: >-
      Intellivra Global builds and hardens cloud platforms on AWS, Azure and GCP, and the
      delivery paths that run on them, so product teams ship more often without waiting on a
      central platform queue.
    body:
      - >-
        Work usually starts with a landing zone or an account structure that has grown
        organically, then moves to Terraform modules, a golden CI/CD path, Kubernetes
        baselines, and observability with SLOs that on-call engineers actually use. Cost
        optimisation is treated as an engineering deliverable, not a spreadsheet exercise.
      - >-
        Typical stack: Terraform, Kubernetes, GitHub Actions, GitLab CI, Argo CD,
        OpenTelemetry, Datadog, Prometheus and Grafana.
    panel_title: What we deliver
    panel:
      - text: Multi-account landing zones with guardrails as code
      - text: Terraform module libraries and drift control
      - text: Kubernetes platform baselines and upgrade runbooks
      - text: CI/CD golden paths with progressive delivery
      - text: Observability, SLOs and incident runbooks
      - text: "FinOps: tagging, showback and rightsizing"
    cta: Talk to a platform lead
    search_terms: AWS Azure GCP Terraform Kubernetes EKS CI CD Argo observability SLO FinOps landing zone

  - id: managed-teams
    name: Managed Teams
    short_name: Managed teams
    service_type: Managed delivery teams
    icon: grid
    card: A product-shaped pod - lead, engineers, QA - accountable for outcomes under a statement of work.
    card_meta: Priced per sprint or milestone
    schema_description: >-
      Intellivra Global runs an outcome-based delivery pod with a named lead, engineers and
      QA, priced per sprint or milestone under a statement of work.
    lead: >-
      A managed team is an Intellivra Global delivery pod - a named lead, engineers and QA -
      that owns an agreed outcome under a statement of work, priced per sprint or per
      milestone rather than per hour.
    body:
      - >-
        Choose this when the work is definable and you would rather buy a result than manage
        contractors. We agree acceptance criteria before anything is built, report against
        them every sprint, and keep one person accountable for the whole thing. Teams can be
        US-based, blended with our India delivery centre, or fully offshore with a guaranteed
        four-hour overlap with your working day.
      - >-
        Typical pods: platform modernisation, data platform build-out, application migration,
        QA automation and sustained product engineering.
    panel_title: At a glance
    panel:
      - label: "Pricing:"
        text: per sprint or per milestone under an SOW
      - label: "Team size:"
        text: typically 4-9 people
      - label: "Time to productive:"
        text: about 3 weeks
      - label: "Accountability:"
        text: one named delivery lead
      - label: "Coverage:"
        text: onshore, blended or offshore with 4-hour overlap
      - label: "Best for:"
        text: definable scope and fixed outcomes
    cta: Scope a managed team
    search_terms: statement of work SOW outcome based delivery pod offshore blended nearshore milestone pricing

