<a class="skip-link" href="#main">Skip to main content</a>

<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="/" aria-label="{{ company.short_name }} - home">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <rect class="brand__mark-bg" width="32" height="32" rx="6" />
        <path class="brand__mark-bars" d="M10 22V13M16 22v-5M22 22V10" stroke-width="2.5" stroke-linecap="round" fill="none" />
      </svg>
      <span><b>Intellivra</b> <i>Global</i></span>
    </a>

    <nav id="primary-nav" class="primary-nav" aria-label="Main navigation">
      <ul>
        {{#each nav}}
        <li><a href="{{ this.href }}"{{#if this.current}} aria-current="page"{{/if}}>{{ this.label }}</a></li>
        {{/each}}
        <li class="nav-cta-item"><a class="nav-cta" href="/contact.html">Talk to us</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <a class="btn btn--primary btn--sm" href="/contact.html">Talk to us</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Open main menu">
        <svg class="icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
        <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>
  </div>
</header>
